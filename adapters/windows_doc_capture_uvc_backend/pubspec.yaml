name: windows_doc_capture_uvc_backend
description: Internal Windows-only Media Foundation backend with bounded native sampling.
version: 0.1.0-dev.1
publish_to: none
environment:
  sdk: '>=3.8.1 <4.0.0'
  flutter: '>=3.32.8'
dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  plugin:
    platforms:
      windows:
        pluginClass: WindowsDocCaptureUvcBackendPluginCApi
